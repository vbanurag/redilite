[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redilite"
version = "1.0.0"
description = "Embedded SQLite-like Key-Value and Data Structure Store with Redis API, RESP TCP Server, and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
redilite = "redilite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
